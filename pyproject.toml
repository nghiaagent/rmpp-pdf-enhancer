[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rmpp-pdf-enhancer"
version = "0.1.0"
description = "Universal color-calibrated PDF, document, textbook, and comic optimizer engineered for reMarkable Paper Pro Canvas Color"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Antigravity (Google DeepMind)"}
]
keywords = ["remarkable", "remarkable-paper-pro", "rmpp", "canvas-color", "e-ink", "pdf", "color-correction", "document", "textbook", "magazine", "comic", "manga"]
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.22.0",
    "img2pdf>=0.5.0",
    "pymupdf>=1.22.0",
    "pikepdf>=8.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.ruff]
# Target the oldest supported interpreter so version-specific lints apply.
target-version = "py39"

[tool.ruff.lint]
# Correctness rules only. Style is deliberately not enforced: the codebase
# predates this config and reformatting it would bury real findings in churn.
select = ["F", "E9", "B", "RUF013"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
rmpp-pdf-enhancer = "rmpp_enhancer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rmpp_enhancer"]

[tool.hatch.build.targets.wheel.sources]
"src/rmpp_enhancer" = "rmpp_enhancer"
