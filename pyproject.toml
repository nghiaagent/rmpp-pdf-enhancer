[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rmpp-pdf-enhancer"
version = "0.1.0"
description = "High-performance comic, manga, and document PDF optimizer engineered for reMarkable Paper Pro Canvas Color"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Antigravity (Google DeepMind)"}
]
keywords = ["remarkable", "remarkable-paper-pro", "rmpp", "canvas-color", "e-ink", "manga", "pdf", "color-correction", "comic"]
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.22.0",
    "img2pdf>=0.5.0",
    "pymupdf>=1.22.0",
    "pikepdf>=8.0.0",
]

[project.scripts]
rmpp-enhance = "rmpp_enhancer.cli:main"
rmpp-pdf-enhancer = "rmpp_enhancer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rmpp_enhancer"]

[tool.hatch.build.targets.wheel.sources]
"src/rmpp_enhancer" = "rmpp_enhancer"
