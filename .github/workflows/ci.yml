name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff
        run: uv run --with ruff ruff check src tests scripts
      - name: Lock file is up to date
        run: uv lock --check

  test:
    name: test ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The full range promised by requires-python, on Linux; plus the
        # newest on macOS, which is what the project is developed against.
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Test
        run: uv run --python ${{ matrix.python }} pytest -q --durations=10

  scripts:
    name: generator scripts run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # These only check the scripts execute and produce output. Whether the
      # committed profile still matches its generator is asserted numerically
      # in tests/test_generated_artifacts.py, which runs on every platform in
      # the matrix. A byte comparison here would fail on any machine but the
      # one that generated the files: the .cube is written at six decimals so
      # last-ulp float differences flip its final digit, and the rendered
      # images shift by ~1 LSB between libjpeg and matplotlib versions.
      - name: Colour profile generator
        run: |
          uv run python scripts/generate_canvas_color_lut.py
          test -s src/rmpp_enhancer/profiles/rmpp_canvas_color.cube
      - name: LUT visualization generator
        run: |
          uv run --with matplotlib python scripts/generate_lut_viz.py
          test -s docs/images/cube_lut_visualization.png
      - name: Benchmark comparison generator
        run: |
          uv run python scripts/generate_illustration_comparisons.py --out-dir "$RUNNER_TEMP/cmp"
          test -s "$RUNNER_TEMP/cmp/Illustration_PaperPro_Comparison.pdf"
          test "$(ls -1 "$RUNNER_TEMP/cmp"/*.jpg | wc -l)" -eq 7

  package:
    name: package installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build wheel and sdist
        run: uv build
      - name: Install the wheel into a clean environment
        run: uv tool install --force dist/*.whl
      - name: Smoke test the installed command
        # uv tool install isolates the CLI, so the runner's python has no
        # Pillow. Use a committed asset rather than generating a fixture.
        run: |
          rmpp-pdf-enhancer --version
          rmpp-pdf-enhancer --help > /dev/null
          rmpp-pdf-enhancer assets/benchmark_illustrations/01_colorcard_target.png \
            -o "$RUNNER_TEMP/out.pdf"
          test -s "$RUNNER_TEMP/out.pdf"
          rmpp-pdf-enhancer assets/benchmark_illustrations \
            -o "$RUNNER_TEMP/sheets.pdf" --per-row 2 --orientation landscape
          test -s "$RUNNER_TEMP/sheets.pdf"
          echo "Installed CLI produced both a single-page and a 2-up PDF."
